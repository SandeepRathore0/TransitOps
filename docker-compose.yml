# docker compose up --build      (needs a .env next to this file; see .env.example)
# App: http://localhost:8080 (or $WEB_PORT). The API is only reachable through nginx at /api/v1;
# the interactive /docs page is disabled when ENVIRONMENT=production (the compose default).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: transitops
      MYSQL_USER: transitops
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (URL-safe characters only)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    # Lets the migration create the audit-log immutability triggers without SUPER.
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://transitops:${DB_PASSWORD}@db:3306/transitops
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_NAME: ${ADMIN_NAME:-Depot Manager}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@transitops.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TRUST_PROXY_HEADERS: "true"      # behind the bundled nginx
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  dbdata:
