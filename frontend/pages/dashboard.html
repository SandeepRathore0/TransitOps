<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TransitOps Dashboard - Fleet overview and trip statistics">
    <title>Dashboard - TransitOps</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .dashboard-columns {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        .vehicle-status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .vehicle-status-bar .status-label {
            width: 100px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .vehicle-status-bar .status-track {
            flex: 1;
            height: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
        }
        .vehicle-status-bar .status-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .vehicle-status-bar .status-count {
            width: 30px;
            text-align: right;
            font-size: 14px;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .dashboard-columns { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">TransitOps</div>
        <a href="dashboard.html" class="nav-item active">Dashboard</a>
        <a href="vehicles.html" class="nav-item">Fleet</a>
        <a href="drivers.html" class="nav-item">Drivers</a>
        <a href="trips.html" class="nav-item">Trips</a>
        <a href="dispatch.html" class="nav-item">Dispatch</a>
    </div>
    <div class="main-content">
        <div class="navbar">
            <div>Dashboard</div>
            <button id="logoutBtn" class="btn">Logout</button>
        </div>
        <div class="content-area">
            <h1 style="margin-bottom: 24px;">Fleet Overview</h1>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-label">Total Vehicles</div>
                    <div class="stat-value" id="statTotalVehicles">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Available Vehicles</div>
                    <div class="stat-value" id="statAvailableVehicles" style="color: var(--success);">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">In Maintenance</div>
                    <div class="stat-value" id="statMaintenance" style="color: var(--warning);">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Trips</div>
                    <div class="stat-value" id="statActiveTrips" style="color: var(--accent-primary);">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending Trips</div>
                    <div class="stat-value" id="statPendingTrips">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Drivers On Duty</div>
                    <div class="stat-value" id="statDriversOnDuty">&mdash;</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Fleet Utilization</div>
                    <div class="stat-value" id="statUtilization" style="color: var(--accent-primary);">&mdash;</div>
                </div>
            </div>

            <div class="dashboard-columns">
                <div class="card">
                    <h2 style="margin-bottom: 16px;">Recent Trips</h2>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Trip #</th>
                                <th>Vehicle</th>
                                <th>Driver</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentTripsBody">
                            <tr><td colspan="4" style="text-align:center; color: var(--text-secondary);">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="card">
                    <h2 style="margin-bottom: 20px;">Vehicle Status</h2>
                    <div id="vehicleStatusBars">
                        <div style="text-align:center; color: var(--text-secondary);">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script type="module">
        import { fetchApi } from '../js/api.js';
        import { logout } from '../js/auth.js';
        document.getElementById('logoutBtn').addEventListener('click', logout);

        function getStatusBadge(status) {
            const map = { 'Draft': 'badge-draft', 'Dispatched': 'badge-dispatched', 'Completed': 'badge-completed', 'Cancelled': 'badge-cancelled', 'Available': 'badge-success', 'On Trip': 'badge-info', 'In Shop': 'badge-warning', 'Retired': 'badge-danger', 'Suspended': 'badge-danger' };
            return map[status] || 'badge-secondary';
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function loadDashboard() {
            try {
                const stats = await fetchApi('/dashboard/stats');
                document.getElementById('statTotalVehicles').textContent = stats.total_vehicles;
                document.getElementById('statAvailableVehicles').textContent = stats.available_vehicles;
                document.getElementById('statMaintenance').textContent = stats.vehicles_in_maintenance;
                document.getElementById('statActiveTrips').textContent = stats.active_trips;
                document.getElementById('statPendingTrips').textContent = stats.pending_trips;
                document.getElementById('statDriversOnDuty').textContent = stats.drivers_on_duty;
                document.getElementById('statUtilization').textContent = Math.round(stats.fleet_utilization) + '%';

                // Vehicle status breakdown bars
                const total = stats.total_vehicles || 1;
                const available = stats.available_vehicles || 0;
                const onTrip = stats.active_trips || 0;
                const inShop = stats.vehicles_in_maintenance || 0;
                const retired = Math.max(0, stats.total_vehicles - available - onTrip - inShop);
                const bars = [
                    { label: 'Available', count: available, color: 'var(--success)' },
                    { label: 'On Trip', count: onTrip, color: 'var(--accent-primary)' },
                    { label: 'In Shop', count: inShop, color: 'var(--warning)' },
                    { label: 'Retired', count: retired, color: 'var(--danger)' }
                ];
                const barsContainer = document.getElementById('vehicleStatusBars');
                barsContainer.innerHTML = bars.map(b => `
                    <div class="vehicle-status-bar">
                        <span class="status-label">${b.label}</span>
                        <div class="status-track">
                            <div class="status-fill" style="width: ${(b.count / total * 100)}%; background: ${b.color};"></div>
                        </div>
                        <span class="status-count">${b.count}</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Failed to load dashboard stats', err);
                showToast('Failed to load dashboard stats', 'error');
            }

            try {
                const trips = await fetchApi('/trips');
                const tbody = document.getElementById('recentTripsBody');
                const recent = trips.slice(0, 5);
                if (recent.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-secondary);">No trips found</td></tr>';
                    return;
                }
                tbody.innerHTML = recent.map(t => `
                    <tr>
                        <td><a href="trip-details.html?id=${t.id}" style="color: var(--accent-primary); text-decoration: none;">${t.trip_number}</a></td>
                        <td>${t.vehicle ? t.vehicle.registration_number : '&mdash;'}</td>
                        <td>${t.driver ? t.driver.name : '&mdash;'}</td>
                        <td><span class="badge ${getStatusBadge(t.status)}">${t.status}</span></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Failed to load trips', err);
            }
        }

        loadDashboard();
    </script>
</body>
</html>
