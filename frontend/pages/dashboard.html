<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Analytics Dashboard - TransitOps V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .grid-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; margin-bottom: 24px; }
        .kpi-card { display: flex; flex-direction: column; gap: 8px; }
        .kpi-title { font-size: 13px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .kpi-value { font-size: 24px; font-weight: 600; color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">TransitOps V4</div>
        <a href="dashboard.html" class="nav-item active">Dashboard</a>
        <a href="users.html" class="nav-item">User Management</a>
        <a href="analytics.html" class="nav-item">Analytics & Reports</a>
        <a href="vehicles.html" class="nav-item">Fleet Management</a>
        <a href="trips.html" class="nav-item">Trip Operations</a>
        <a href="audit.html" class="nav-item">System Audit</a>
    </div>
    
    <div class="main-content">
        <div class="navbar">
            <div>Enterprise Dashboard</div>
            <div style="display: flex; gap: 16px; align-items: center;">
                <button id="exportCsvBtn" class="btn">Export Analytics (CSV)</button>
                <button id="logoutBtn" class="btn">Logout</button>
            </div>
        </div>
        
        <div class="content-area">
            <h1 style="margin-bottom: 24px;">Executive Summary</h1>
            
            <div class="grid-kpis" id="kpiContainer">
                <div class="card kpi-card skeleton" style="height: 80px;"></div>
                <div class="card kpi-card skeleton" style="height: 80px;"></div>
                <div class="card kpi-card skeleton" style="height: 80px;"></div>
                <div class="card kpi-card skeleton" style="height: 80px;"></div>
            </div>

            <div class="grid-charts">
                <div class="card">
                    <h3 style="margin-bottom: 16px;">Operational Cost Breakdown</h3>
                    <canvas id="costChart" height="200"></canvas>
                </div>
                <div class="card">
                    <h3 style="margin-bottom: 16px;">Fleet Utilization Trend</h3>
                    <canvas id="utilizationChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { fetchApi } from '../js/api.js';
        import { logout } from '../js/auth.js';
        import { showToast } from '../js/utils.js';

        document.getElementById('logoutBtn').addEventListener('click', logout);
        
        async function loadAnalytics() {
            try {
                const kpis = await fetchApi('/analytics/kpis');
                
                document.getElementById('kpiContainer').innerHTML = `
                    <div class="card kpi-card">
                        <span class="kpi-title">Fleet Utilization</span>
                        <span class="kpi-value">${kpis.fleet_utilization}%</span>
                    </div>
                    <div class="card kpi-card">
                        <span class="kpi-title">Total Op Cost</span>
                        <span class="kpi-value">₹${kpis.operational_cost.toLocaleString()}</span>
                    </div>
                    <div class="card kpi-card">
                        <span class="kpi-title">Available Fleet</span>
                        <span class="kpi-value">${kpis.available_vehicles} / ${kpis.total_vehicles}</span>
                    </div>
                    <div class="card kpi-card">
                        <span class="kpi-title">Available Drivers</span>
                        <span class="kpi-value">${kpis.available_drivers} / ${kpis.total_drivers}</span>
                    </div>
                `;

                // Render Cost Chart
                const ctx = document.getElementById('costChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Fuel Cost', 'Maintenance', 'Other Expenses'],
                        datasets: [{
                            data: [kpis.total_fuel_cost, kpis.total_maintenance_cost, 0],
                            backgroundColor: ['#3B82F6', '#10B981', '#F59E0B'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        plugins: { legend: { labels: { color: '#F9FAFB' } } },
                        cutout: '70%'
                    }
                });
                
                // Placeholder for Utilization Chart (Bar)
                const utilCtx = document.getElementById('utilizationChart').getContext('2d');
                new Chart(utilCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{
                            label: 'Vehicles On Trip',
                            data: [4, 6, 8, kpis.on_trip_vehicles, kpis.on_trip_vehicles + 1, kpis.on_trip_vehicles - 1, 3],
                            backgroundColor: '#3B82F6',
                            borderRadius: 4
                        }]
                    },
                    options: {
                        scales: {
                            y: { ticks: { color: '#9CA3AF' }, grid: { color: '#374151' } },
                            x: { ticks: { color: '#9CA3AF' }, grid: { display: false } }
                        },
                        plugins: { legend: { labels: { color: '#F9FAFB' } } }
                    }
                });

                showToast('Analytics loaded successfully', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        document.getElementById('exportCsvBtn').onclick = () => {
            const token = localStorage.getItem('token');
            // Standard browser download triggers don't easily support Authorization headers directly
            // So we pass the token as a query parameter or just use fetch -> Blob for secure downloads
            fetch('http://127.0.0.1:8000/api/v1/analytics/export/vehicles', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                if(!res.ok) throw new Error('Export failed');
                return res.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'vehicles_report.csv';
                document.body.appendChild(a);
                a.click();
                a.remove();
                showToast('CSV Export Downloaded', 'success');
            })
            .catch(err => showToast(err.message, 'error'));
        };

        loadAnalytics();
    </script>
</body>
</html>
