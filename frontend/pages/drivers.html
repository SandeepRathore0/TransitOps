<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drivers - TransitOps</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <style>
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
            align-items: center; justify-content: center;
        }
        .modal-content {
            width: 400px; max-height: 90vh; overflow-y: auto;
        }
        .form-label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-secondary); font-weight: 500; }
        .action-btn {
            padding: 6px 12px; font-size: 12px; margin-right: 4px;
        }
        .search-bar { width: 300px; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">TransitOps</div>
        <a href="dashboard.html" class="nav-item">Dashboard</a>
        <a href="vehicles.html" class="nav-item">Fleet</a>
        <a href="drivers.html" class="nav-item active">Drivers</a>
    </div>
    <div class="main-content">
        <div class="navbar">
            <div>Driver Management</div>
            <button id="logoutBtn" class="btn">Logout</button>
        </div>
        <div class="content-area">
            <div style="display: flex; justify-content: space-between; margin-bottom: 24px; align-items: center;">
                <h1>Drivers</h1>
                <div style="display: flex; gap: 16px;">
                    <select id="statusFilter" class="input-field search-bar" style="width: 150px; margin-bottom: 0;">
                        <option value="">All Statuses</option>
                        <option value="Available">Available</option>
                        <option value="On Trip">On Trip</option>
                        <option value="Off Duty">Off Duty</option>
                        <option value="Suspended">Suspended</option>
                    </select>
                    <input type="text" id="searchInput" class="input-field search-bar" placeholder="Search License...">
                    <button id="addBtn" class="btn btn-primary">+ Add Driver</button>
                </div>
            </div>
            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>License</th>
                            <th>Category</th>
                            <th>Safety Score</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px;">
                    <div style="color: var(--text-secondary); font-size: 14px;" id="pageInfo">Showing 0 to 0 of 0 entries</div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn" id="prevBtn" disabled>Previous</button>
                        <button class="btn" id="nextBtn" disabled>Next</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="formModal" class="modal">
        <div class="modal-content card">
            <h2 id="modalTitle" style="margin-bottom: 16px;">Add Driver</h2>
            <form id="dataForm">
                <input type="hidden" id="driverId">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" class="input-field" required>
                
                <label class="form-label" for="licenseNumber">License Number</label>
                <input type="text" id="licenseNumber" class="input-field" required>
                
                <label class="form-label" for="category">License Category</label>
                <input type="text" id="category" class="input-field" placeholder="e.g. CDL, HMV" required>
                
                <label class="form-label" for="expiry">License Expiry</label>
                <input type="date" id="expiry" class="input-field" required>
                
                <label class="form-label" for="phone">Phone Number</label>
                <input type="text" id="phone" class="input-field" required>
                
                <label class="form-label" for="safetyScore">Safety Score (0-100)</label>
                <input type="number" id="safetyScore" class="input-field" required min="0" max="100">
                
                <label class="form-label" for="status">Status</label>
                <select id="status" class="input-field" style="margin-bottom: 24px;">
                    <option value="Available">Available</option>
                    <option value="On Trip">On Trip</option>
                    <option value="Off Duty">Off Duty</option>
                    <option value="Suspended">Suspended</option>
                </select>
                <div style="display: flex; justify-content: flex-end; gap: 12px;">
                    <button type="button" class="btn" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content card">
            <h2 style="margin-bottom: 16px;">Confirm Delete</h2>
            <p style="margin-bottom: 24px;">Are you sure you want to delete this driver?</p>
            <input type="hidden" id="deleteId">
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button type="button" class="btn" id="cancelDeleteBtn">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { fetchApi } from '../js/api.js';
        import { logout } from '../js/auth.js';
        
        document.getElementById('logoutBtn').addEventListener('click', logout);
        
        let allDrivers = [];
        let filteredDrivers = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        async function loadData() {
            try {
                allDrivers = await fetchApi('/drivers');
                applyFilters();
            } catch (err) {
                alert(err.message);
            }
        }

        function applyFilters() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            filteredDrivers = allDrivers.filter(d => {
                const matchSearch = d.license_number.toLowerCase().includes(term) || d.name.toLowerCase().includes(term);
                const matchStatus = status ? d.status === status : true;
                return matchSearch && matchStatus;
            });
            
            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const totalItems = filteredDrivers.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
            
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedData = filteredDrivers.slice(startIndex, endIndex);

            paginatedData.forEach(d => {
                const statusClass = d.status === 'Available' ? 'badge-success' : d.status === 'Suspended' ? 'badge-danger' : 'badge-warning';
                tbody.innerHTML += `
                    <tr>
                        <td>${d.name}</td>
                        <td>${d.license_number}</td>
                        <td>${d.license_category}</td>
                        <td>${d.safety_score}</td>
                        <td><span class="badge ${statusClass}">${d.status}</span></td>
                        <td>
                            <button class="btn btn-primary action-btn edit-btn" data-id="${d.id}">Edit</button>
                            <button class="btn btn-danger action-btn delete-btn" data-id="${d.id}">Delete</button>
                        </td>
                    </tr>
                `;
            });

            document.querySelectorAll('.edit-btn').forEach(btn => btn.onclick = () => openEdit(btn.dataset.id));
            document.querySelectorAll('.delete-btn').forEach(btn => btn.onclick = () => openDelete(btn.dataset.id));
            
            document.getElementById('pageInfo').innerText = `Showing ${totalItems === 0 ? 0 : startIndex + 1} to ${Math.min(endIndex, totalItems)} of ${totalItems} entries`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('statusFilter').addEventListener('change', applyFilters);

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentPage > 1) { currentPage--; renderTable(); }
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            const totalPages = Math.ceil(filteredDrivers.length / itemsPerPage);
            if (currentPage < totalPages) { currentPage++; renderTable(); }
        });

        const formModal = document.getElementById('formModal');
        const deleteModal = document.getElementById('deleteModal');

        document.getElementById('addBtn').onclick = () => {
            document.getElementById('dataForm').reset();
            document.getElementById('driverId').value = '';
            document.getElementById('modalTitle').innerText = 'Add Driver';
            formModal.style.display = 'flex';
        };

        document.getElementById('cancelBtn').onclick = () => formModal.style.display = 'none';
        document.getElementById('cancelDeleteBtn').onclick = () => deleteModal.style.display = 'none';

        function openEdit(id) {
            const d = allDrivers.find(x => x.id == id);
            if (!d) return;
            document.getElementById('driverId').value = d.id;
            document.getElementById('name').value = d.name;
            document.getElementById('licenseNumber').value = d.license_number;
            document.getElementById('category').value = d.license_category;
            document.getElementById('expiry').value = d.license_expiry;
            document.getElementById('phone').value = d.phone;
            document.getElementById('safetyScore').value = d.safety_score;
            document.getElementById('status').value = d.status;
            document.getElementById('modalTitle').innerText = 'Edit Driver';
            formModal.style.display = 'flex';
        }

        function openDelete(id) {
            document.getElementById('deleteId').value = id;
            deleteModal.style.display = 'flex';
        }

        document.getElementById('dataForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('driverId').value;
            const payload = {
                name: document.getElementById('name').value,
                license_number: document.getElementById('licenseNumber').value,
                license_category: document.getElementById('category').value,
                license_expiry: document.getElementById('expiry').value,
                phone: document.getElementById('phone').value,
                safety_score: parseInt(document.getElementById('safetyScore').value),
                status: document.getElementById('status').value
            };

            try {
                if (id) {
                    await fetchApi(`/drivers/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
                } else {
                    await fetchApi('/drivers/', { method: 'POST', body: JSON.stringify(payload) });
                }
                formModal.style.display = 'none';
                loadData();
            } catch (err) {
                alert(err.message);
            }
        };

        document.getElementById('confirmDeleteBtn').onclick = async () => {
            const id = document.getElementById('deleteId').value;
            try {
                await fetchApi(`/drivers/${id}`, { method: 'DELETE' });
                deleteModal.style.display = 'none';
                loadData();
            } catch (err) {
                alert(err.message);
            }
        };

        loadData();
    </script>
</body>
</html>
